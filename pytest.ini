[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marca tests que requieren MT5/Telethon/Gemini reales (los excluimos por defecto)
markers =
    integration: integration tests que requieren MT5/Telethon/Gemini reales
    slow: tests que tardan >1s

addopts =
    -v
    --tb=short
    --strict-markers

# pytest-asyncio: auto modo para no marcar cada async test
asyncio_mode = auto
